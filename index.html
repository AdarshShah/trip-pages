<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Apps</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.svg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="My Apps">
    <meta name="theme-color" content="#0c0f14">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="auth.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0c0f14;
            --surface: rgba(255,255,255,0.045);
            --surface-hover: rgba(255,255,255,0.085);
            --border: rgba(255,255,255,0.08);
            --border-hover: rgba(255,255,255,0.18);
            --text-primary: #f0ede8;
            --text-secondary: rgba(240,237,232,0.45);
            --text-tertiary: rgba(240,237,232,0.25);
            --glow: rgba(255,255,255,0.04);
            --toast-bg: rgba(20,24,32,0.96);
            --toggle-bg: rgba(255,255,255,0.07);
            --toggle-icon: #f0ede8;
        }
        [data-theme="light"] {
            --bg: #f2efe9;
            --surface: rgba(255,255,255,0.72);
            --surface-hover: rgba(255,255,255,0.95);
            --border: rgba(0,0,0,0.07);
            --border-hover: rgba(0,0,0,0.15);
            --text-primary: #1a1814;
            --text-secondary: rgba(26,24,20,0.45);
            --text-tertiary: rgba(26,24,20,0.25);
            --glow: rgba(0,0,0,0.03);
            --toast-bg: rgba(26,24,20,0.94);
            --toggle-bg: rgba(0,0,0,0.07);
            --toggle-icon: #1a1814;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* ── Animated background ── */
        .bg-scene {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        [data-theme="dark"] .bg-scene {
            background: radial-gradient(ellipse 80% 60% at 20% 10%, rgba(16,32,24,0.9) 0%, transparent 70%),
                        radial-gradient(ellipse 60% 50% at 80% 80%, rgba(10,18,32,0.8) 0%, transparent 65%),
                        linear-gradient(160deg, #090c10 0%, #0c1118 40%, #0a0e0c 100%);
        }
        [data-theme="light"] .bg-scene {
            background: radial-gradient(ellipse 80% 60% at 20% 10%, rgba(225,235,225,0.9) 0%, transparent 70%),
                        radial-gradient(ellipse 60% 50% at 80% 80%, rgba(215,225,240,0.8) 0%, transparent 65%),
                        linear-gradient(160deg, #ede9e3 0%, #f2efe9 50%, #eae8e3 100%);
        }

        /* Grain overlay */
        .bg-scene::after {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0.032;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            background-size: 128px 128px;
        }

        /* Floating orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            animation: driftOrb var(--dur, 18s) ease-in-out infinite alternate;
            opacity: 0;
        }
        [data-theme="dark"] .orb { opacity: var(--op, 0.18); }
        [data-theme="light"] .orb { opacity: var(--op, 0.22); filter: blur(110px); }

        @keyframes driftOrb {
            0%   { transform: translate(0, 0) scale(1); }
            33%  { transform: translate(var(--dx1, 40px), var(--dy1, -30px)) scale(1.08); }
            66%  { transform: translate(var(--dx2, -20px), var(--dy2, 20px)) scale(0.94); }
            100% { transform: translate(var(--dx3, 30px), var(--dy3, 10px)) scale(1.04); }
        }

        /* ── Layout ── */
        .page-wrap {
            position: relative;
            z-index: 1;
            max-width: 680px;
            margin: 0 auto;
            padding: 0 24px 80px;
        }

        /* ── Theme toggle ── */
        .theme-toggle {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 100;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--toggle-bg);
            color: var(--toggle-icon);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.25s ease, border-color 0.25s ease, transform 0.2s ease;
            backdrop-filter: blur(12px);
        }
        .theme-toggle:hover { background: var(--surface-hover); transform: scale(1.08); }
        .theme-toggle:active { transform: scale(0.93); }

        /* ── Header ── */
        .header {
            padding-top: 72px;
            padding-bottom: 48px;
        }
        .header-eyebrow {
            font-family: 'DM Sans', sans-serif;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            margin-bottom: 10px;
            animation: fadeSlideUp 0.7s ease both;
        }
        .header-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(52px, 10vw, 76px);
            font-weight: 600;
            line-height: 0.92;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            animation: fadeSlideUp 0.7s ease 0.08s both;
        }
        .header-title em {
            font-style: italic;
            font-weight: 400;
        }
        .header-sub {
            margin-top: 14px;
            font-size: 13px;
            font-weight: 400;
            color: var(--text-secondary);
            letter-spacing: 0.01em;
            animation: fadeSlideUp 0.7s ease 0.16s both;
        }

        /* ── Section label ── */
        .section-label {
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-tertiary);
            margin-bottom: 16px;
            animation: fadeSlideUp 0.7s ease 0.22s both;
        }

        /* ── App grid ── */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }
        @media (min-width: 520px) {
            .app-grid { grid-template-columns: repeat(3, 1fr); }
        }

        /* ── App card ── */
        .app-card {
            position: relative;
            border-radius: 24px;
            border: 1px solid var(--border);
            background: var(--surface);
            backdrop-filter: blur(20px);
            padding: 22px 18px 20px;
            cursor: pointer;
            transition: transform 0.22s cubic-bezier(.34,1.3,.64,1),
                        box-shadow 0.22s ease,
                        border-color 0.22s ease,
                        background 0.22s ease;
            animation: fadeSlideUp 0.6s ease both;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .app-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: var(--glow);
            opacity: 0;
            transition: opacity 0.22s ease;
        }
        .app-card:hover {
            transform: translateY(-5px) scale(1.015);
            border-color: var(--border-hover);
            background: var(--surface-hover);
            box-shadow: 0 20px 50px rgba(0,0,0,0.22), 0 4px 12px rgba(0,0,0,0.12);
        }
        .app-card:hover::before { opacity: 1; }
        .app-card:active { transform: translateY(-2px) scale(0.985); }

        /* Card badge */
        .card-badge {
            position: absolute;
            top: 14px;
            right: 14px;
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 100px;
        }
        .card-badge.live {
            background: rgba(52,211,153,0.12);
            color: #34d399;
            border: 1px solid rgba(52,211,153,0.25);
        }
        .card-badge.soon {
            background: rgba(255,255,255,0.06);
            color: var(--text-tertiary);
            border: 1px solid var(--border);
        }

        /* Icon wrapper */
        .card-icon-wrap {
            width: 58px;
            height: 58px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #fff;
            margin-bottom: 16px;
            position: relative;
            flex-shrink: 0;
            box-shadow: 0 8px 24px rgba(0,0,0,0.28);
            transition: transform 0.22s ease, box-shadow 0.22s ease;
        }
        .app-card:hover .card-icon-wrap {
            transform: scale(1.06) rotate(-2deg);
            box-shadow: 0 12px 32px rgba(0,0,0,0.35);
        }
        .card-icon-wrap::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(145deg, rgba(255,255,255,0.22) 0%, transparent 60%);
        }

        /* Muted icon (coming soon) */
        .card-icon-wrap.muted {
            background: rgba(255,255,255,0.06) !important;
            box-shadow: none;
            color: var(--text-tertiary);
            font-size: 20px;
        }
        [data-theme="light"] .card-icon-wrap.muted {
            background: rgba(0,0,0,0.06) !important;
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.01em;
            line-height: 1.2;
            margin-bottom: 3px;
        }
        .card-sub {
            font-size: 10px;
            font-weight: 400;
            color: var(--text-secondary);
            letter-spacing: 0.01em;
        }
        .app-card.dimmed .card-title { color: var(--text-secondary); }
        .app-card.dimmed .card-sub   { color: var(--text-tertiary); }

        /* Divider line */
        .section-divider {
            height: 1px;
            background: linear-gradient(to right, transparent, var(--border), transparent);
            margin: 40px 0 32px;
            animation: fadeIn 0.8s ease 0.4s both;
        }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--toast-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-hover);
            border-radius: 100px;
            padding: 12px 22px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.01em;
            z-index: 999;
            white-space: nowrap;
            transition: transform 0.35s cubic-bezier(.34,1.4,.64,1), opacity 0.3s ease;
            opacity: 0;
            backdrop-filter: blur(20px);
            box-shadow: 0 12px 36px rgba(0,0,0,0.3);
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* ── Animations ── */
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; } to { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Background scene -->
    <div class="bg-scene">
        <div class="orb" style="width:500px;height:500px;top:-100px;left:-150px;background:radial-gradient(circle,#1a4731,transparent);--dur:22s;--op:0.22;--dx1:60px;--dy1:-40px;--dx2:-30px;--dy2:50px;--dx3:45px;--dy3:-20px;"></div>
        <div class="orb" style="width:400px;height:400px;bottom:-80px;right:-100px;background:radial-gradient(circle,#0a2540,transparent);--dur:26s;--op:0.18;--dx1:-50px;--dy1:30px;--dx2:40px;--dy2:-60px;--dx3:-25px;--dy3:45px;"></div>
        <div class="orb" style="width:280px;height:280px;top:40%;left:50%;background:radial-gradient(circle,#1e1a0e,transparent);--dur:19s;--op:0.12;--dx1:30px;--dy1:50px;--dx2:-60px;--dy2:-20px;--dx3:20px;--dy3:60px;"></div>
    </div>

    <!-- Theme toggle -->
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
        <i class="fa-solid fa-circle-half-stroke" id="theme-icon"></i>
    </button>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <div class="page-wrap">

        <!-- Header -->
        <div class="header">
            <p class="header-eyebrow">Personal Hub</p>
            <h1 class="header-title">My <em>Apps</em></h1>
            <p class="header-sub">Everything in one place — tap to open.</p>
        </div>

        <!-- App grid -->
        <p class="section-label">Applications</p>
        <div class="app-grid" id="app-grid"></div>

        <div class="section-divider"></div>

        <!-- Footer -->
        <p style="font-size:10px;color:var(--text-tertiary);text-align:center;letter-spacing:0.1em;animation:fadeIn 1s ease 0.6s both;">
            PERSONAL DASHBOARD &nbsp;·&nbsp; v1.0
        </p>

    </div>

    <script>
        // ── Firebase ──────────────────────────────────────────────────
        const FIREBASE_DB_URL = 'https://my-app-d7de4-default-rtdb.asia-southeast1.firebasedatabase.app';
        const APPS_DB_PATH    = `${FIREBASE_DB_URL}/apps.json`;

        async function loadApps() {
            const res = await fetch(APPS_DB_PATH);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            if (!data) return [];
            // Firebase stores arrays as {"0":{...},"1":{...},...} — restore order.
            return Object.keys(data).sort((a, b) => Number(a) - Number(b)).map(k => data[k]);
        }

        function renderApps(apps) {
            const grid = document.getElementById('app-grid');
            grid.innerHTML = '';
            apps.forEach((app, i) => {
                const isLive    = !!app.href;
                const isMuted   = !app.gradient;
                const badgeCls  = isLive ? 'live' : 'soon';
                const cardCls   = isMuted ? 'app-card dimmed' : 'app-card';
                const iconCls   = isMuted ? 'card-icon-wrap muted' : 'card-icon-wrap';
                const iconStyle = app.gradient ? `background:${app.gradient};` : '';
                const card = document.createElement('div');
                card.className = cardCls;
                card.style.animationDelay = `${0.28 + i * 0.07}s`;
                card.innerHTML = `
                    ${app.badge ? `<span class="card-badge ${badgeCls}">${app.badge}</span>` : ''}
                    <div class="${iconCls}" style="${iconStyle}">
                        <i class="fa-solid ${app.icon}"></i>
                    </div>
                    <div class="card-title">${app.title}</div>
                    ${app.subtitle ? `<div class="card-sub">${app.subtitle}</div>` : ''}
                `;
                card.addEventListener('click', () => {
                    if (isLive) window.location.href = app.href;
                    else showToast(`${app.title} — coming soon!`);
                });
                grid.appendChild(card);
            });
        }

        function showLoadingGrid() {
            const grid = document.getElementById('app-grid');
            grid.innerHTML = Array.from({ length: 6 }, () =>
                `<div class="app-card dimmed" style="opacity:.4;pointer-events:none">
                    <div class="card-icon-wrap muted"></div>
                    <div class="card-title" style="background:rgba(255,255,255,.08);border-radius:6px;height:18px;width:80px;margin:0 auto"></div>
                </div>`
            ).join('');
        }

        // Toast
        let toastTimer;
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
        }

        // Theme
        function toggleTheme() {
            const html = document.documentElement;
            const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        }

        // Init
        async function init() {
            const saved = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
            showLoadingGrid();
            await window.authReady;
            const apps = await loadApps();
            renderApps(apps);
        }

        init();
    </script>
</body>
</html>
