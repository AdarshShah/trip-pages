<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bengaluru Spotter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700;800&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans:   ['Inter', 'sans-serif'],
                        serif:  ['Playfair Display', 'serif'],
                        header: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* ── ANIMATIONS ── */
        @keyframes float {
            0%,100% { transform: translateY(0) rotate(0deg); }
            33%      { transform: translateY(-14px) rotate(4deg); }
            66%      { transform: translateY(-7px) rotate(-3deg); }
        }
        @keyframes slideInRight {
            from { opacity:0; transform:translateX(24px); }
            to   { opacity:1; transform:translateX(0); }
        }
        @keyframes slideInUp {
            from { opacity:0; transform:translateY(16px); }
            to   { opacity:1; transform:translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity:0; } to { opacity:1; }
        }
        @keyframes ripple {
            0%   { transform:scale(1);   opacity:.7; }
            100% { transform:scale(2.6); opacity:0; }
        }
        @keyframes spinRing {
            to { transform:rotate(360deg); }
        }
        @keyframes glowPulse {
            0%,100% { box-shadow: 0 0 20px rgba(14,165,233,.4); }
            50%      { box-shadow: 0 0 48px rgba(14,165,233,.75); }
        }
        @keyframes stepIn {
            from { opacity:0; transform:translateX(18px); }
            to   { opacity:1; transform:translateX(0); }
        }
        @keyframes stepInBack {
            from { opacity:0; transform:translateX(-18px); }
            to   { opacity:1; transform:translateX(0); }
        }
        @keyframes bounceDot {
            0%,80%,100% { transform:translateY(0); }
            40%          { transform:translateY(-6px); }
        }

        /* ── BASE ── */
        body {
            background: linear-gradient(160deg, #e8f4f8 0%, #f0f4f8 40%, #f5f5f7 100%);
            background-attachment: fixed;
        }

        /* ── LOADING ── */
        .loading-overlay {
            position:fixed; inset:0; z-index:1000;
            background: linear-gradient(145deg, #0f2035 0%, #1a4a6b 60%, #0e7490 100%);
            display:flex; align-items:center; justify-content:center;
            transition: opacity .5s ease;
        }
        .loader-ring {
            width:56px; height:56px;
            border:3px solid rgba(255,255,255,.18);
            border-top-color:#fff;
            border-radius:50%;
            animation: spinRing .75s linear infinite;
        }
        .bounce-dot { animation: bounceDot 1.2s ease-in-out infinite; }

        /* ── GLASS ── */
        .glass-card {
            background: rgba(255,255,255,.97);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(14,116,144,.12);
            box-shadow: 0 4px 28px rgba(14,116,144,.09);
        }

        /* ── HERO ── */
        .hero-bg {
            background: linear-gradient(160deg, #0f2035 0%, #1a4a6b 45%, #0e7490 75%, #065986 100%);
        }
        .hero-glow {
            position:absolute; top:22px; right:28px;
            width:56px; height:56px;
            background: radial-gradient(circle, rgba(14,165,233,.95) 0%, rgba(56,189,248,.55) 45%, transparent 72%);
            border-radius:50%;
            animation: glowPulse 2.8s ease-in-out infinite;
        }
        .floating-icon {
            position:absolute; opacity:.22;
            animation: float var(--dur,5s) ease-in-out infinite;
            animation-delay: var(--del,0s);
            user-select:none; pointer-events:none;
        }

        /* ── MODAL ── */
        #add-form-modal {
            display:none;
            background: rgba(0,0,0,.6);
            backdrop-filter: blur(4px);
        }
        .modal-sheet {
            animation: slideInUp .28s cubic-bezier(.34,1.56,.64,1) forwards;
        }

        /* ── FAB ── */
        .fab {
            position:fixed; bottom:24px; right:24px;
            width:56px; height:56px;
            background: linear-gradient(135deg, #1a6b8a, #0e7490);
            border-radius:50%; border:none; color:#fff; font-size:20px;
            display:flex; align-items:center; justify-content:center;
            cursor:pointer; z-index:80;
            box-shadow: 0 8px 24px rgba(14,116,144,.45);
            transition: transform .2s, box-shadow .2s;
        }
        .fab::before {
            content:''; position:absolute; inset:0; border-radius:50%;
            background:inherit; animation: ripple 2.2s ease-out infinite;
        }
        .fab:hover { transform:scale(1.1); box-shadow:0 12px 36px rgba(14,116,144,.55); }
        .fab:active { transform:scale(.94); }

        /* ── STEP FORM ── */
        .step-panel { display:none; }
        .step-panel.active { display:block; animation: stepIn .22s ease forwards; }
        .step-panel.active.from-back { animation: stepInBack .22s ease forwards; }
        .step-dot { transition: width .25s ease, background .25s ease; border-radius:9999px; height:6px; }

        /* ── CATEGORY TILES ── */
        .cat-tile {
            border: 1.5px solid #e5e7eb;
            border-radius: 14px;
            padding: 11px 10px;
            display: flex;
            align-items: center;
            gap: 9px;
            cursor: pointer;
            transition: border-color .18s, background .18s, transform .15s;
            background: #fafafa;
        }
        .cat-tile:hover { background: #f0f9ff; border-color: #bae6fd; transform: scale(1.02); }
        .cat-tile.selected { border-color: var(--cat-color); background: var(--cat-light); }
        .cat-tile .tile-icon {
            width: 30px; height: 30px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; color: #fff; flex-shrink: 0;
        }
        .cat-tile .tile-name { font-size: 11px; font-weight: 600; color: #374151; line-height: 1.2; }

        /* ── FILTER TABS ── */
        .filter-strip {
            display: flex;
            gap: 7px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .filter-strip::-webkit-scrollbar { display: none; }
        .filter-tab {
            flex-shrink: 0;
            padding: 6px 13px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 600;
            border: 1.5px solid #e5e7eb;
            background: white;
            color: #6b7280;
            cursor: pointer;
            transition: all .18s ease;
            white-space: nowrap;
        }
        .filter-tab:hover { border-color: #7dd3fc; color: #0369a1; }
        .filter-tab.active {
            background: linear-gradient(135deg, #1a6b8a, #0e7490);
            border-color: transparent;
            color: white;
        }

        /* ── SPOT CARD ── */
        .spot-card {
            background: white;
            border: 1px solid rgba(14,116,144,.1);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            gap: 12px;
            transition: transform .15s ease, box-shadow .15s ease;
            animation: slideInRight .35s ease-out both;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        .spot-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(14,116,144,.13);
        }
        .spot-card.pressing {
            transform: scale(0.97);
            box-shadow: 0 2px 14px rgba(14,116,144,.18);
        }
        .spot-icon {
            width: 46px; height: 46px;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 17px; color: white;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(0,0,0,.18);
        }

        /* ── VISITED PILL ── */
        .visited-pill {
            display: inline-flex; align-items: center; gap: 3px;
            font-size: 9px; font-weight: 700;
            text-transform: uppercase; letter-spacing: .08em;
            padding: 3px 8px; border-radius: 100px;
            cursor: pointer; transition: transform .15s ease, opacity .15s;
            border: 1px solid transparent;
        }
        .visited-pill.yes { background:#dcfce7; color:#15803d; border-color:#bbf7d0; }
        .visited-pill.no  { background:#fef9c3; color:#a16207; border-color:#fde68a; }
        .visited-pill:hover { transform: scale(1.06); opacity:.85; }

        /* ── CATEGORY SECTION ── */
        .cat-section-header {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 10px;
        }
        .cat-section-badge {
            font-size: 9px; font-weight: 800;
            letter-spacing: .13em; text-transform: uppercase;
            padding: 4px 11px; border-radius: 100px;
            color: white; white-space: nowrap; flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,.18);
        }
        .cat-section-line { flex:1; height:1px; opacity:.15; }


        /* ── PRESS ANIMATIONS ── */
        @keyframes holdPulse {
            0%   { box-shadow: 0 8px 28px rgba(14,116,144,.13); }
            100% { box-shadow: 0 0 0 3px rgba(14,116,144,.22), 0 8px 28px rgba(14,116,144,.15); }
        }
        @keyframes cardPop {
            0%   { transform: scale(0.972); }
            60%  { transform: scale(1.016); }
            100% { transform: scale(1); }
        }
        .card-pressing {
            transform: scale(0.972) !important;
            animation: holdPulse .6s ease forwards !important;
            border-color: rgba(14,116,144,.3) !important;
            transition: transform .12s ease !important;
        }
        .card-pop { animation: cardPop .3s ease forwards !important; }

        /* ── MISC ── */
        .input-focus { transition: border-color .2s, box-shadow .2s; }
        .input-focus:focus { border-color:#1a6b8a; box-shadow: 0 0 0 3px rgba(26,107,138,.12); outline:none; }
        .text-shadow { text-shadow: 0 2px 16px rgba(0,0,0,.4); }
        .sync-dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
    </style>
</head>
<body class="font-sans text-gray-800 flex flex-col items-center p-0 sm:p-4 min-h-screen relative">

    <!-- ═══ LOADING SCREEN ═══ -->
    <div id="loading-screen" class="loading-overlay">
        <div class="text-center">
            <div class="loader-ring mx-auto mb-5"></div>
            <p class="text-[11px] font-bold text-white/70 uppercase tracking-[.22em] mb-3">Loading Bengaluru Spotter…</p>
            <div class="flex justify-center space-x-1.5">
                <span class="w-1.5 h-1.5 bg-white/40 rounded-full bounce-dot" style="animation-delay:0s"></span>
                <span class="w-1.5 h-1.5 bg-white/40 rounded-full bounce-dot" style="animation-delay:.18s"></span>
                <span class="w-1.5 h-1.5 bg-white/40 rounded-full bounce-dot" style="animation-delay:.36s"></span>
            </div>
        </div>
    </div>

    <!-- ═══ ADD SPOT MODAL ═══ -->
    <div id="add-form-modal" class="fixed inset-0 z-[100] items-center justify-center p-4" onclick="handleModalBackdrop(event)">
        <div class="modal-sheet glass-card w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden" id="modal-inner">

            <!-- Step Header -->
            <div class="px-6 pt-6 pb-4" style="background:linear-gradient(135deg,#f0f9ff,#fff);">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <p class="text-[9px] font-black text-gray-400 uppercase tracking-[.18em] mb-0.5" id="step-label">Step 1 of 4</p>
                        <h2 class="text-lg font-serif" style="color:#0c4a6e" id="step-title">Pick a Category</h2>
                    </div>
                    <button onclick="closeModal()" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white border border-gray-100 text-gray-400 hover:text-red-500 hover:bg-red-50 transition-colors shadow-sm">
                        <i class="fa-solid fa-times text-sm"></i>
                    </button>
                </div>
                <!-- Progress bar -->
                <div class="w-full h-1.5 bg-gray-100 rounded-full overflow-hidden mb-3">
                    <div id="step-progress" class="h-full rounded-full transition-all duration-300" style="background:linear-gradient(90deg,#1a6b8a,#0e7490);width:25%;"></div>
                </div>
                <!-- Step dots -->
                <div class="flex justify-center gap-2">
                    <div class="step-dot" data-step="1" style="width:20px;background:#1a6b8a;"></div>
                    <div class="step-dot" data-step="2" style="width:6px;background:#e5e7eb;"></div>
                    <div class="step-dot" data-step="3" style="width:6px;background:#e5e7eb;"></div>
                    <div class="step-dot" data-step="4" style="width:6px;background:#e5e7eb;"></div>
                </div>
            </div>

            <!-- Form -->
            <form id="spot-form" class="px-6 pb-6" onsubmit="return false;">

                <!-- Step 1: Category -->
                <div class="step-panel active" data-step="1">
                    <div class="py-4">
                        <div id="cat-tiles-grid" class="grid grid-cols-2 gap-2.5"></div>
                    </div>
                </div>

                <!-- Step 2: Name & Description -->
                <div class="step-panel" data-step="2">
                    <div class="space-y-4 py-5">
                        <div>
                            <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1.5">
                                Name <span class="text-red-400 normal-case font-normal">*required</span>
                            </label>
                            <input type="text" id="form-name" placeholder="e.g., Toit Brewpub"
                                   class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm input-focus">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1.5">
                                Description <span class="normal-case font-normal text-gray-300">(optional)</span>
                            </label>
                            <textarea id="form-description" placeholder="What makes this place special?"
                                      class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm input-focus resize-none" rows="3"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Step 3: Location -->
                <div class="step-panel" data-step="3">
                    <div class="space-y-3 py-5">
                        <div>
                            <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1.5">
                                Location <span class="normal-case font-normal text-gray-300">(optional)</span>
                            </label>
                            <input type="text" id="form-location" placeholder="Address or area in Bengaluru"
                                   class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm input-focus">
                            <input type="hidden" id="form-lat">
                            <input type="hidden" id="form-lng">
                        </div>
                        <button type="button" id="loc-btn" onclick="requestLocation()"
                                class="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-semibold border transition-all active:scale-95"
                                style="border-color:#bae6fd;color:#0369a1;background:#f0f9ff;">
                            <i class="fa-solid fa-location-crosshairs"></i>
                            Use My Location
                        </button>
                        <p class="text-[10px] text-gray-400 text-center">Location will open in Google Maps when tapped on a card.</p>
                    </div>
                </div>

                <!-- Step 4: Pro Tip -->
                <div class="step-panel" data-step="4">
                    <div class="space-y-4 py-5">
                        <div>
                            <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1.5">
                                Pro Tip <span class="normal-case font-normal text-gray-300">(optional)</span>
                            </label>
                            <input type="text" id="form-tip" placeholder="e.g., Best on weekday evenings!"
                                   class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm input-focus">
                        </div>
                        <div class="p-3.5 rounded-2xl" style="background:#f0f9ff;border:1px solid #bae6fd;">
                            <p class="text-[9px] font-black text-sky-600 uppercase tracking-wider mb-1">
                                <i class="fa-solid fa-check-circle mr-1"></i>Ready to add
                            </p>
                            <p class="text-[11px] text-sky-700 font-medium leading-relaxed" id="form-preview-text"></p>
                        </div>
                    </div>
                </div>

                <!-- Navigation -->
                <div class="flex gap-3 pt-2 border-t border-gray-100">
                    <button type="button" id="btn-back" onclick="stepBack()"
                            class="w-11 h-11 flex-shrink-0 flex items-center justify-center rounded-xl bg-gray-100 text-gray-500 hover:bg-gray-200 transition-colors"
                            style="display:none;">
                        <i class="fa-solid fa-arrow-left text-sm"></i>
                    </button>
                    <button type="button" id="btn-next" onclick="stepNext()"
                            class="flex-1 py-3 rounded-xl font-bold text-sm text-white transition-all active:scale-95 shadow-md"
                            style="background:linear-gradient(135deg,#1a6b8a,#0e7490);">
                        Continue <i class="fa-solid fa-arrow-right ml-1.5"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ═══ MAIN CONTAINER ═══ -->
    <div class="w-full max-w-md bg-white relative overflow-hidden sm:rounded-3xl flex flex-col min-h-screen sm:min-h-0"
         style="box-shadow:0 30px 90px rgba(0,0,0,.18);">

        <!-- ── HERO HEADER ── -->
        <header class="hero-bg relative w-full overflow-hidden" style="height:260px;">

            <!-- Glow dot -->
            <div class="hero-glow"></div>

            <!-- Floating city icons -->
            <div class="floating-icon" style="top:12%;left:7%;font-size:22px;--dur:5.2s;--del:0s">🏙️</div>
            <div class="floating-icon" style="top:28%;right:14%;font-size:16px;--dur:6.4s;--del:1.1s">🌳</div>
            <div class="floating-icon" style="top:55%;left:18%;font-size:13px;--dur:4.8s;--del:2.3s">🍽️</div>
            <div class="floating-icon" style="top:38%;right:6%;font-size:18px;--dur:7.1s;--del:.6s">🛍️</div>
            <div class="floating-icon" style="top:68%;left:4%;font-size:11px;--dur:5.6s;--del:1.8s">☕</div>
            <div class="floating-icon" style="top:18%;left:42%;font-size:12px;--dur:6.0s;--del:3.0s">🏛️</div>

            <!-- Dot grid overlay -->
            <div class="absolute inset-0 pointer-events-none"

                <path d="M0 64 L0 54 L400 54 L400 64 Z" fill="rgba(255,255,255,.04)"/>

            <!-- Back to hub -->
            <a href="index.html"

                <i class="fa-solid fa-chevron-left text-[9px]"></i> Hub
            </a>

            <!-- Hero content -->
            <div class="absolute bottom-0 left-0 w-full px-8 pb-8 z-10">
                <div class="mb-2" style="animation:slideInUp .6s ease-out .1s both">
                    <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[9px] font-black tracking-[.15em] uppercase shadow-lg"
                          style="background:linear-gradient(135deg,#0ea5e9,#38bdf8);color:#0c4a6e;">
                        ✦ Bengaluru City Guide ✦
                    </span>
                </div>
                <h1 class="text-[38px] font-serif text-white leading-none mb-2 text-shadow"
                    style="animation:slideInUp .6s ease-out .22s both;">Bengaluru<br>Spotter</h1>
                <p class="text-white/70 font-medium flex items-center text-sm gap-1.5"
                   style="animation:slideInUp .6s ease-out .34s both;">
                    <i class="fa-solid fa-location-dot text-sky-300 text-xs"></i>

                </p>
            </div>
        </header>

        <!-- ── MAIN ── -->
        <main class="flex-1 px-5 py-6">

            <!-- Filter strip -->
            <div class="mb-5">
                <div class="filter-strip" id="filter-strip"></div>
            </div>

            <!-- Spots list -->
            <div id="spots-container"></div>

        </main>

        <!-- ── FOOTER ── -->
        <footer class="px-6 py-6 text-center border-t border-gray-100"
                style="background:linear-gradient(180deg,#f9fafb,#f0f9ff);">
            <div class="flex items-center justify-center gap-2 mb-2">
                <div class="h-px w-8" style="background:linear-gradient(to right,transparent,#bae6fd);"></div>
                <i class="fa-solid fa-location-dot text-[10px]" style="color:#1a6b8a;opacity:.5;"></i>
                <div class="h-px w-8" style="background:linear-gradient(to left,transparent,#bae6fd);"></div>
            </div>
            <p class="text-[9px] font-black text-gray-400 uppercase tracking-[.25em] mb-1">Bengaluru Spotter • v1.0</p>
            <p class="text-xs text-gray-500 font-medium italic mb-4">Explore the Garden City 🌳</p>
            <button onclick="fetchData(true)"
                    class="inline-flex items-center px-5 py-2.5 bg-white rounded-full text-[9px] font-black uppercase tracking-widest hover:bg-sky-50 transition-all active:scale-95 shadow-sm"
                    style="border:1px solid rgba(14,116,144,.25);color:#0c4a6e;">
                <i class="fa-solid fa-rotate mr-1.5"></i>Sync Now
            </button>
            <div class="flex items-center justify-center gap-1.5 mt-3">
                <span id="sync-dot" class="sync-dot bg-amber-400 animate-pulse"></span>
                <span id="sync-text" class="text-[9px] font-bold text-gray-400 uppercase tracking-widest">Connecting…</span>
            </div>
        </footer>
    </div>

    <!-- ── FAB ── -->
    <button onclick="openModal()" class="fab"><i class="fa-solid fa-plus"></i></button>

    <script>
        // ── FIREBASE CONFIG ──
        const FIREBASE_BASE = 'https://my-app-d7de4-default-rtdb.asia-southeast1.firebasedatabase.app';
        const FIREBASE_URL  = FIREBASE_BASE + '/spots';

        // ── JSONBIN (migration only — safe to remove after first load) ──
        const JSONBIN_API_KEY = 'REDACTED_API_KEY';
        const JSONBIN_URL     = 'https://api.jsonbin.io/v3/b/6a04bde5c0954111d81b978b';

        // ── CATEGORIES ──
        const CATS = {
            'Food & Dining':  { color:'#f59e0b', light:'#fffbeb', icon:'fa-utensils',      label:'Food'     },
            'Heritage':       { color:'#8b5cf6', light:'#faf5ff', icon:'fa-landmark',      label:'Heritage' },
            'Parks & Nature': { color:'#22c55e', light:'#f0fdf4', icon:'fa-tree',          label:'Nature'   },
            'Shopping':       { color:'#ec4899', light:'#fdf2f8', icon:'fa-bag-shopping',  label:'Shopping' },
            'Entertainment':  { color:'#0ea5e9', light:'#f0f9ff', icon:'fa-masks-theater', label:'Fun'      },
            'Workspaces':     { color:'#64748b', light:'#f8fafc', icon:'fa-laptop',        label:'Work'     },
            'Fitness':        { color:'#14b8a6', light:'#f0fdfa', icon:'fa-dumbbell',      label:'Fitness'  },
            'Utilities':      { color:'#f97316', light:'#fff7ed', icon:'fa-screwdriver-wrench', label:'Utils' },
        };

        let spotsData       = [];
        let isSyncing       = false;
        let activeFilter    = 'all';
        let selectedCategory = null;
        let editingId       = null;
        let currentStep     = 1;
        const TOTAL_STEPS   = 4;
        const STEP_TITLES   = ['Pick a Category', 'Name & Description', 'Location', 'Pro Tip'];
        const STEP_PCT      = [25, 50, 75, 100];

        // ── HELPERS ──
        const hideLoading = () => {
            const el = document.getElementById('loading-screen');
            if (!el) return;
            el.style.opacity = '0';
            setTimeout(() => el.style.display = 'none', 500);
        };
        const updateStatus = (text, dotCls) => {
            document.getElementById('sync-text').innerText = text;
            document.getElementById('sync-dot').className = `sync-dot mr-2 ${dotCls}`;
        };

        // ── INIT ──
        window.onload = () => {
            buildCategoryTiles();
            fetchData();
            setInterval(() => fetchData(false), 15000);
        };

        // ── FETCH ──
        window.fetchData = async (manual = false) => {
            if (isSyncing) return;
            isSyncing = true;
            if (manual) updateStatus('Syncing…', 'bg-blue-400 animate-pulse');
            try {
                const res  = await fetch(`${FIREBASE_URL}.json`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (data !== null) {
                    spotsData = Array.isArray(data) ? data : Object.values(data);
                    updateStatus('Cloud Synced', 'bg-emerald-500');
                } else {
                    const migrated = await migrateFromJSONBin();
                    if (migrated) {
                        spotsData = migrated;
                        updateStatus('Cloud Synced', 'bg-emerald-500');
                    } else {
                        const raw = localStorage.getItem('bengaluru_spots');
                        spotsData = raw ? JSON.parse(raw) : [];
                        updateStatus('Local Mode', 'bg-amber-500');
                    }
                }
            } catch (err) {
                console.error('Fetch Error:', err);
                const raw = localStorage.getItem('bengaluru_spots');
                spotsData = raw ? JSON.parse(raw) : [];
                updateStatus('Sync Failed', 'bg-red-500');
            } finally {
                isSyncing = false;
                renderUI();
                hideLoading();
            }
        };

        // ── SAVE ──
        window.saveData = async () => {
            saveDataLocal();
            await pushDataCloud();
            renderUI();
        };
        const saveDataLocal = () => localStorage.setItem('bengaluru_spots', JSON.stringify(spotsData));
        const pushDataCloud = async () => {
            updateStatus('Saving…', 'bg-blue-400 animate-pulse');
            try {
                const res = await fetch(`${FIREBASE_URL}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(spotsData)
                });
                if (!res.ok) throw new Error('Push failed');
                updateStatus('Cloud Synced', 'bg-emerald-500');
            } catch (err) {
                console.error('Push Error:', err);
                updateStatus('Save Error', 'bg-red-500');
            }
        };

        // ── ONE-TIME MIGRATION FROM JSONBIN ──
        async function migrateFromJSONBin() {
            if (localStorage.getItem('migrated_spots')) return null;
            updateStatus('Migrating…', 'bg-amber-400 animate-pulse');
            try {
                const res = await fetch(JSONBIN_URL, { headers: { 'X-Master-Key': JSONBIN_API_KEY } });
                if (!res.ok) return null;
                const data = await res.json();
                const items = data.record?.spots;
                if (items?.length) {
                    await fetch(`${FIREBASE_URL}.json`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(items)
                    });
                    localStorage.setItem('migrated_spots', '1');
                    return items;
                }
            } catch {}
            return null;
        }

        // ── RENDER UI ──
        function renderUI() {
            renderFilterStrip();

            const container = document.getElementById('spots-container');
            container.innerHTML = '';

            if (spotsData.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16" style="animation:fadeIn .5s ease;">
                        <div class="text-5xl mb-4">🗺️</div>
                        <h3 class="text-base font-bold text-gray-700 mb-1.5">No spots yet!</h3>
                        <p class="text-sm text-gray-400">Tap <strong class="text-gray-600">+</strong> to add your first Bengaluru spot.</p>
                    </div>`;
                return;
            }

            Object.keys(CATS).forEach((cat, secIdx) => {
                const spots = spotsData.filter(s => s.category === cat);
                if (spots.length === 0) return;

                const section = document.createElement('div');
                section.className = 'mb-8';
                section.dataset.cat = cat;
                if (activeFilter !== 'all' && activeFilter !== cat) section.style.display = 'none';

                const cfg = CATS[cat];
                section.innerHTML = `
                    <div class="cat-section-header">
                        <span class="cat-section-badge" style="background:${cfg.color};">
                            <i class="fa-solid ${cfg.icon} mr-1"></i>${cat}
                        </span>
                        <div class="cat-section-line flex-1" style="background:${cfg.color};"></div>
                        <span class="text-[9px] font-black text-gray-400 bg-white px-2 py-0.5 rounded-full border border-gray-100">${spots.length}</span>
                    </div>
                    <div class="space-y-3" id="sec-${secIdx}"></div>
                `;
                container.appendChild(section);

                const secEl = document.getElementById(`sec-${secIdx}`);
                spots.forEach((spot, idx) => {
                    secEl.appendChild(buildSpotCard(spot, idx, secIdx));
                });
            });
        }

        function buildSpotCard(spot, cardIdx, secIdx) {
            const cfg    = CATS[spot.category] || CATS['Food & Dining'];
            const mapUrl = spot.lat && spot.lng
                ? `https://www.google.com/maps?q=${spot.lat},${spot.lng}`
                : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(spot.location || spot.name + ' Bengaluru')}`;

            const locHTML = spot.location ? `
                <a href="${mapUrl}" target="_blank" rel="noopener"
                   class="flex items-center gap-1.5 text-[11px] font-semibold mt-1 hover:opacity-75 transition-opacity"
                   style="color:${cfg.color};" onclick="event.stopPropagation()">
                    <i class="fa-solid fa-location-dot text-[10px] flex-shrink-0"></i>
                    <span class="truncate">${spot.location}</span>
                    <i class="fa-solid fa-arrow-up-right-from-square text-[8px] opacity-50 flex-shrink-0 ml-auto"></i>
                </a>` : '';

            const descHTML = spot.description
                ? `<p class="text-[11px] text-gray-500 mt-1.5 leading-relaxed line-clamp-2">${spot.description}</p>` : '';

            const tipHTML = spot.tips?.length
                ? `<div class="mt-2 flex items-start gap-1.5 text-[10px] text-amber-700 font-medium bg-amber-50 px-2.5 py-2 rounded-lg border border-amber-100">
                       <i class="fa-solid fa-lightbulb text-amber-400 text-[9px] mt-0.5 flex-shrink-0"></i>
                       <span>${spot.tips[0]}</span>
                   </div>` : '';

            const card = document.createElement('div');
            card.className = 'spot-card';
            card.style.animationDelay = `${(cardIdx + secIdx) * 0.055}s`;
            card.innerHTML = `
                <div class="spot-icon" style="background:linear-gradient(145deg,${cfg.color},${cfg.color}bb);">
                    <i class="fa-solid ${cfg.icon}"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex justify-between items-start gap-2 mb-0.5">
                        <h3 class="font-bold text-gray-800 text-sm leading-tight">${spot.name}</h3>
                        <button class="visited-pill ${spot.visited ? 'yes' : 'no'} flex-shrink-0"
                                onclick="toggleVisited('${spot.id}')" title="Toggle visited">
                            ${spot.visited
                                ? '<i class="fa-solid fa-check text-[8px]"></i> Visited'
                                : '<i class="fa-solid fa-clock text-[8px]"></i> To Visit'}
                        </button>
                    </div>
                    ${locHTML}${descHTML}${tipHTML}
                    <div class="flex items-center justify-between mt-2.5 pt-2 border-t border-gray-50">
                        <span class="text-[9px] font-bold px-2 py-0.5 rounded-full"
                              style="color:${cfg.color};background:${cfg.light};">
                            <i class="fa-solid ${cfg.icon} mr-0.5 text-[8px]"></i>${cfg.label}
                        </span>
                        <button onclick="deleteSpot('${spot.id}')"
                                class="text-gray-300 hover:text-red-500 p-1 rounded-lg hover:bg-red-50 transition-colors" title="Delete">
                            <i class="fa-solid fa-trash-can text-[11px]"></i>
                        </button>
                    </div>
                </div>`;
            // Long-press to edit
            let _pt, _sx, _sy;
            const _ps = (e) => {
                if (e.target.closest('button, a')) return;
                const p = e.touches ? e.touches[0] : e;
                _sx = p.clientX; _sy = p.clientY;
                card.classList.add('pressing');
                _pt = setTimeout(() => { card.classList.remove('pressing'); openEditModal(spot.id); }, 600);
            };
            const _pm = (e) => {
                const p = e.touches ? e.touches[0] : e;
                if (Math.abs(p.clientX - _sx) > 8 || Math.abs(p.clientY - _sy) > 8) { clearTimeout(_pt); card.classList.remove('pressing'); }
            };
            const _pe = () => { clearTimeout(_pt); card.classList.remove('pressing'); };
            card.addEventListener('touchstart',  _ps, { passive: true });
            card.addEventListener('touchmove',   _pm, { passive: true });
            card.addEventListener('touchend',    _pe);
            card.addEventListener('touchcancel', _pe);
            card.addEventListener('mousedown',   _ps);
            card.addEventListener('mousemove',   _pm);
            card.addEventListener('mouseup',     _pe);
            card.addEventListener('mouseleave',  _pe);
            card.addEventListener('contextmenu', e => e.preventDefault());
            return card;
        }



        function renderFilterStrip() {
            const counts = {};
            spotsData.forEach(s => { counts[s.category] = (counts[s.category] || 0) + 1; });

            const strip = document.getElementById('filter-strip');
            strip.innerHTML = `
                <button class="filter-tab ${activeFilter === 'all' ? 'active' : ''}"
                        onclick="setFilter('all')">All${spotsData.length ? ` (${spotsData.length})` : ''}</button>`;

            Object.keys(CATS).forEach(cat => {
                if (!counts[cat]) return;
                strip.innerHTML += `
                    <button class="filter-tab ${activeFilter === cat ? 'active' : ''}"
                            onclick="setFilter('${cat.replace(/'/g,"\\'")}')">
                        ${CATS[cat].label} (${counts[cat]})
                    </button>`;
            });
        }

        window.setFilter = (cat) => { activeFilter = cat; renderUI(); };

        // ── CATEGORY TILES ──
        function buildCategoryTiles() {
            const grid = document.getElementById('cat-tiles-grid');
            Object.entries(CATS).forEach(([key, cfg]) => {
                const tile = document.createElement('div');
                tile.className = 'cat-tile';
                tile.dataset.cat = key;
                tile.style.setProperty('--cat-color', cfg.color);
                tile.style.setProperty('--cat-light', cfg.light);
                tile.innerHTML = `
                    <div class="tile-icon" style="background:${cfg.color};">
                        <i class="fa-solid ${cfg.icon}"></i>
                    </div>
                    <span class="tile-name">${key}</span>`;
                tile.addEventListener('click', () => {
                    selectedCategory = key;
                    document.querySelectorAll('.cat-tile').forEach(t => t.classList.toggle('selected', t.dataset.cat === key));
                });
                grid.appendChild(tile);
            });
        }

        // ── STEP NAVIGATION ──
        function goToStep(step, fromBack = false) {
            const prev = document.querySelector(`.step-panel[data-step="${currentStep}"]`);
            const next = document.querySelector(`.step-panel[data-step="${step}"]`);
            prev.classList.remove('active');
            next.classList.toggle('from-back', fromBack);
            next.classList.add('active');
            currentStep = step;

            document.getElementById('step-label').innerText = `Step ${step} of ${TOTAL_STEPS}`;
            document.getElementById('step-title').innerText = STEP_TITLES[step - 1];
            document.getElementById('step-progress').style.width = `${STEP_PCT[step - 1]}%`;

            document.querySelectorAll('.step-dot').forEach(dot => {
                const s = parseInt(dot.dataset.step);
                dot.style.background = s <= step ? '#1a6b8a' : '#e5e7eb';
                dot.style.width      = s === step ? '20px' : '6px';
            });

            document.getElementById('btn-back').style.display = step > 1 ? '' : 'none';
            document.getElementById('btn-next').innerHTML = step === TOTAL_STEPS
                ? (editingId ? '<i class="fa-solid fa-check mr-1.5"></i> Save Changes' : '<i class="fa-solid fa-check mr-1.5"></i> Add Spot')
                : 'Continue <i class="fa-solid fa-arrow-right ml-1.5"></i>';

            if (step === 4) {
                const name = document.getElementById('form-name').value;
                const loc  = document.getElementById('form-location').value;
                document.getElementById('form-preview-text').innerText =
                    `"${name}"${loc ? ` · ${loc}` : ''} will be ${editingId ? 'updated' : 'saved'} under ${selectedCategory}.`;
            }
        }

        function flashInvalid(el) {
            el.style.borderColor = '#ef4444';
            el.focus();
            setTimeout(() => el.style.borderColor = '', 1500);
        }

        window.stepNext = () => {
            if (currentStep === 1) {
                if (!selectedCategory) {
                    document.querySelectorAll('.cat-tile').forEach(t => {
                        t.style.outline = '1.5px solid #ef4444';
                        setTimeout(() => t.style.outline = '', 1500);
                    });
                    return;
                }
            }
            if (currentStep === 2 && !document.getElementById('form-name').value.trim()) {
                flashInvalid(document.getElementById('form-name')); return;
            }
            if (currentStep < TOTAL_STEPS) {
                goToStep(currentStep + 1);
            } else {
                submitSpot();
            }
        };
        window.stepBack = () => { if (currentStep > 1) goToStep(currentStep - 1, true); };

        // ── MODAL ──
        window.openModal = () => {
            editingId = null;
            selectedCategory = null;
            document.querySelectorAll('.cat-tile').forEach(t => t.classList.remove('selected'));
            document.getElementById('spot-form').reset();
            document.getElementById('form-lat').value = '';
            document.getElementById('form-lng').value = '';
            const btn = document.getElementById('loc-btn');
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-location-crosshairs"></i> Use My Location';
            goToStep(1);
            document.getElementById('add-form-modal').style.display = 'flex';
        };
        window.openEditModal = (id) => {
            const spot = spotsData.find(s => s.id === id);
            if (!spot) return;
            editingId = id;
            selectedCategory = spot.category;
            document.querySelectorAll('.cat-tile').forEach(t => t.classList.toggle('selected', t.dataset.cat === spot.category));
            document.getElementById('form-name').value        = spot.name;
            document.getElementById('form-description').value = spot.description || '';
            document.getElementById('form-location').value    = spot.location    || '';
            document.getElementById('form-lat').value         = spot.lat         || '';
            document.getElementById('form-lng').value         = spot.lng         || '';
            document.getElementById('form-tip').value         = (spot.tips && spot.tips[0]) || '';
            const btn = document.getElementById('loc-btn');
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-location-crosshairs"></i> Use My Location';
            goToStep(1);
            document.getElementById('add-form-modal').style.display = 'flex';
        };
        window.closeModal = () => { editingId = null; document.getElementById('add-form-modal').style.display = 'none'; };
        window.handleModalBackdrop = (e) => { if (e.target === document.getElementById('add-form-modal')) closeModal(); };

        // ── GEOLOCATION ──
        window.requestLocation = async () => {
            if (!navigator.geolocation) { alert('Geolocation is not supported by this browser.'); return; }
            const btn   = document.getElementById('loc-btn');
            const input = document.getElementById('form-location');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1.5"></i>Getting location…';

            navigator.geolocation.getCurrentPosition(
                async ({ coords: { latitude: lat, longitude: lng } }) => {
                    document.getElementById('form-lat').value = lat;
                    document.getElementById('form-lng').value = lng;
                    try {
                        const res  = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`);
                        const data = await res.json();
                        input.value = data.display_name || `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
                    } catch {
                        input.value = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
                    }
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-check mr-1.5 text-emerald-500"></i>Location set';
                },
                () => {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-location-crosshairs"></i> Use My Location';
                    alert('Could not get your location. Please enter it manually.');
                },
                { timeout: 10000 }
            );
        };

        // ── SUBMIT ──
        function submitSpot() {
            const tip = document.getElementById('form-tip').value.trim();
            const fields = {
                name:        document.getElementById('form-name').value.trim(),
                category:    selectedCategory,
                location:    document.getElementById('form-location').value.trim(),
                lat:         parseFloat(document.getElementById('form-lat').value) || null,
                lng:         parseFloat(document.getElementById('form-lng').value) || null,
                description: document.getElementById('form-description').value.trim(),
                tips:        tip ? [tip] : [],
            };
            if (editingId) {
                const i = spotsData.findIndex(s => s.id === editingId);
                if (i !== -1) spotsData[i] = { ...spotsData[i], ...fields };
                editingId = null;
            } else {
                spotsData.push({ id: crypto.randomUUID(), ...fields, visited: false, addedAt: new Date().toISOString() });
            }
            saveData();
            closeModal();
        }

        // ── ACTIONS ──
        window.deleteSpot = (id) => {
            spotsData = spotsData.filter(s => s.id !== id);
            saveData();
        };
        window.toggleVisited = (id) => {
            const i = spotsData.findIndex(s => s.id === id);
            if (i !== -1) { spotsData[i].visited = !spotsData[i].visited; saveData(); }
        };
    </script>
</body>
</html>
